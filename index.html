<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Tribu</title>
<meta name="description" content="Organisation familiale : taches menageres, courses, menus de la semaine, pense-betes et points a echanger contre des cadeaux.">
<meta name="theme-color" content="#4E7A6A">

<!-- Apercu du lien quand quelqu'un le partage : Facebook, Instagram,
     Messenger, WhatsApp, LinkedIn, iMessage. Sans ces balises, le lien
     s'affiche en adresse nue, sans titre ni image.
     Les adresses doivent etre ABSOLUES : les reseaux lisent la page depuis
     leurs propres serveurs, un chemin relatif ne leur dit rien. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ma Tribu">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://matribu-app.fr/">
<meta property="og:title" content="Ma Tribu — La maison, c'est l'affaire de tous">
<meta property="og:description" content="Tâches, courses, menus de la semaine et 353 recettes, partagés entre tous. Chacun sait ce qu'il a à faire, et les enfants gagnent des points.">
<meta property="og:image" content="https://matribu-app.fr/partage.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ma Tribu : tâches, courses, menus, 353 recettes et points, à partager en famille.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ma Tribu — La maison, c'est l'affaire de tous">
<meta name="twitter:description" content="Tâches, courses, menus de la semaine et 353 recettes, partagés entre tous.">
<meta name="twitter:image" content="https://matribu-app.fr/partage.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">

<!-- Demarrage : les modules Firebase viennent de gstatic, et app.js ne les
     demande qu'une fois les 880 Ko de l'application analyses — soit environ
     400 ms perdus (mesure du 12/09/2026). On ouvre la connexion tout de
     suite et on precharge les modules, pour que le telechargement se fasse
     PENDANT l'analyse au lieu de la suivre.
     `crossorigin` est obligatoire : sans lui le navigateur telechargerait
     deux fois. En mode local (localhost sans ?nuage=1) ces fichiers ne
     servent pas : la console peut le signaler, c'est sans consequence. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>

<!-- Filet de securite : attrape les erreurs AVANT que le reste ne soit chargé,
     pour ne jamais laisser une page blanche sans explication. -->
<script>
window.__erreursDemarrage = [];
function __noterErreur(texte) {
  window.__erreursDemarrage.push(texte);
  if (window.__signalerPanne) window.__signalerPanne();
}
window.addEventListener("error", function (e) {
  if (e.target && e.target.tagName === "SCRIPT") {
    __noterErreur("Fichier manquant ou illisible : " + (e.target.src || "").split("/").pop());
    return;
  }
  __noterErreur(e.message + (e.filename ? " (" + e.filename.split("/").pop() + ", ligne " + e.lineno + ")" : ""));
}, true);
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason || {};
  __noterErreur([r.code, r.message || String(e.reason)].filter(Boolean).join(" — "));
});
/* Si au bout de 8 secondes rien ne s'affiche, on explique au lieu de rester blanc. */
setTimeout(function () {
  var app = document.getElementById("ecran-app");
  var chargement = document.getElementById("chargement");
  if (!chargement || !app || !app.hidden) return;
  if (window.__signalerPanne) { window.__signalerPanne(); return; }
  chargement.innerHTML =
    '<div class="logo-tribu">🏡</div><h1>Ça coince</h1>' +
    '<p class="intro">L\'application n\'a pas réussi à démarrer.</p>' +
    '<div class="carte"><div class="carte-titre">Détail technique</div>' +
    '<p style="font-size:.78rem;line-height:1.5;word-break:break-word;margin:0">' +
    (window.__erreursDemarrage.join(" | ") || "Aucun message. Fichier app.js absent ou bloqué ?") +
    '</p></div>' +
    '<button class="btn principal plein" onclick="location.reload()">Recharger la page</button>' +
    '<p class="aide centre" style="margin-top:1rem">Faites une capture d\'écran de ce message.</p>';
}, 8000);
</script>

<script src="firebase-config.js"></script>
</head>
<body>

<!-- ============ Ecran de connexion (rempli par app.js) ============ -->
<div class="connexion" id="ecran-connexion">
  <div id="chargement">
    <div class="logo-tribu">🏡</div>
    <h1>Ma Tribu</h1>
    <p class="intro">Chargement…</p>
  </div>
</div>

<!-- ============ Application ============ -->
<div class="app" id="ecran-app" hidden>

  <header class="topbar">
    <button class="avatar" id="btn-profil" title="Mon profil" data-action="menu-profil">🙂</button>
    <button class="topbar-titre" id="btn-entete" data-action="aller" data-vue="accueil">
      <b id="titre-vue">Accueil</b>
      <span id="sous-titre-vue"></span>
    </button>
    <button class="pastille-points" id="btn-points" title="Mes points" data-action="aller" data-vue="points">
      <span>🌟</span><span id="mes-points">0</span>
    </button>
  </header>

  <main>
    <section class="vue" id="vue-accueil"></section>
    <section class="vue" id="vue-taches"></section>
    <section class="vue" id="vue-courses"></section>
    <section class="vue" id="vue-reserve"></section>
    <section class="vue" id="vue-menus"></section>
    <section class="vue" id="vue-notes"></section>
    <section class="vue" id="vue-points"></section>
    <section class="vue" id="vue-recettes"></section>
    <section class="vue" id="vue-admin"></section>
  </main>

  <button class="fab" id="fab" hidden>+</button>

  <nav class="nav">
    <!-- Les onglets sont construits par l'application : un administrateur
         peut en masquer (Administration > Onglets visibles). -->
    <div class="nav-inner" id="nav-inner"></div>
  </nav>

</div>

<!-- ============ Feuille modale + toast ============ -->
<div class="voile" id="voile">
  <div class="feuille" id="feuille" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<!-- `defer` : les quatre fichiers se telechargent EN PARALLELE, et s'executent
     ensuite dans cet ordre, avant DOMContentLoaded — donc avant le demarrage,
     qui s'y accroche (app.js). Sans lui, chacun attendait le precedent :
     recettes.js et ses 343 Ko retardaient a eux seuls l'arrivee de app.js,
     donc l'ouverture de l'application (mesure du 12/09/2026). -->
<script src="recettes.js" defer></script>
<script src="vues.js" defer></script>
<script src="formulaires.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
